# autoref topic config — Monocular Depth Estimation for UAV mapping
# Relative paths resolve against the project root (parent of the configs/ folder).
name: mde_uav_mapping
db: data/mde_uav_mapping.sqlite
vault: vault/mde_uav_mapping

# Sources in priority order: for references/citations/lookups the first source that returns data wins.
# Per source: enabled (default true), api_key / mailto where applicable, and
# max_rate = maximum requests per second (omit for the safe default; values above the
# documented limit log a warning). Alias names: s2 = semantic_scholar, oa = openalex.
sources:
  semantic_scholar:
    api_key: ${S2_API_KEY:-}      # optional but strongly recommended (free on request)
    max_rate: 1.0                 # documented limit with a key: 1 request/second
  openalex:
    # Free key from https://openalex.org/settings/api. Without one OpenAlex allows ~100 search pages/day
    # (shared 0.10 USD budget per IP) and no cursor paging (page=N up to 10,000 results is used instead).
    api_key: ${OPENALEX_API_KEY:-}
    mailto: ${OPENALEX_MAILTO:-}  # optional e-mail for OpenAlex's "polite pool"
    max_rate: 6                   # documented limit: 10 requests/second
  arxiv:
    max_rate: 0.32                # arXiv asks for at most 1 request per 3 seconds
    # categories: [cs.CV, cs.RO]  # optional: restrict search to these arXiv categories

search:
  queries:
    - monocular depth estimation
    - self-supervised monocular depth estimation
    - metric monocular depth estimation zero-shot
    - monocular depth estimation aerial UAV
    - monocular depth drone mapping
    - dense mapping monocular depth odometry
    - monocular depth SLAM 3D reconstruction
    - depth foundation model
    - UAV 3D reconstruction monocular camera
    - depth fusion TSDF learned depth
  year_from: 2014
  limit_per_query: 200   # results per query and source; or `all` = keep paging until results stop being relevant
  # total: 500            # optional: stop a run after this many distinct papers (shared fairly by all queries/sources)
  stop:                     # only used with `all` (judged with filter.keywords below)
    min_yield: 0.2          # a page with < 20% relevant results is "low yield" ...
    patience: 2             # ... stop after this many low-yield pages in a row
    page_size: 50           # results per request while exploring
    max_results: 2000       # hard cap per query and source (S2 search itself stops at 1000)
  filter:
    mode: keywords            # none | keywords | llm
    keywords_needed: 2
    min_relevance: 0.5
    keywords: [depth, monocular, single image, uav, drone, aerial, mapping, reconstruction, slam,
               odometry, tsdf, point cloud, disparity, stereo, metric scale]
    topic_description: >
      Mapping and 3D reconstruction from UAV/drone imagery using monocular (single-camera) depth
      estimation networks combined with external odometry/pose (GNSS/IMU/VIO). Relevant: monocular
      depth estimation methods (supervised, self-supervised, metric, foundation models), depth
      fusion/mapping (TSDF, voxel, point cloud), monocular SLAM/VO with learned depth, aerial datasets.

snowball:
  depth: 1
  direction: references       # references | citations | both
  max_per_paper: 30

llm:
  # OpenAI-compatible endpoint; this one is a local Ollama. Swap base_url/model for LM Studio,
  # vLLM, OpenRouter (https://openrouter.ai/api/v1) or OpenAI (base_url omitted).
  default:
    provider: openai_compat
    base_url: http://localhost:11434/v1
    model: qwen2.5:14b
  relations:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 1024
  # categorize / fill / relevance fall back to `default` when omitted

categorize:
  mode: multi
  min_confidence: 0.4
  categories:
    - id: mde
      label: Monocular Depth Estimation
      description: Methods that predict per-pixel depth from a single RGB image.
      subcategories:
        - id: mde_supervised
          label: Supervised MDE
          description: Trained with ground-truth depth (LiDAR, RGB-D, synthetic).
        - id: mde_self_supervised
          label: Self-supervised MDE
          description: Trained from monocular video or stereo pairs via photometric reconstruction, no GT depth.
        - id: mde_metric
          label: Metric / zero-shot metric depth
          description: Predicts absolute-scale depth, e.g. camera-intrinsics conditioning, canonical camera space, metric foundation models.
        - id: mde_relative
          label: Relative / affine-invariant depth
          description: Predicts depth up to scale/shift (e.g. MiDaS-style), relies on scale-shift-invariant losses.
        - id: mde_foundation
          label: Depth foundation models
          description: Large-scale pretrained general-purpose depth models (ViT/diffusion backbones, huge mixed datasets).
    - id: scale_recovery
      label: Scale recovery & sensor fusion
      description: Recovering metric scale of learned depth using external odometry, IMU, GNSS, sparse points, altitude.
    - id: mapping
      label: Mapping & 3D reconstruction
      description: Building maps/3D models from depth or images.
      subcategories:
        - id: map_fusion
          label: Depth fusion (TSDF/voxel/surfel)
          description: Fusing per-frame depth maps with known poses into volumetric/surfel/point maps.
        - id: map_slam
          label: Monocular SLAM / VO with learned depth
          description: SLAM or visual odometry systems that use learned depth priors.
        - id: map_neural
          label: Neural scene representations
          description: NeRF / 3D Gaussian splatting / implicit mapping.
    - id: uav
      label: UAV / aerial
      description: Work specifically on drone or aerial imagery, platforms or applications.
    - id: datasets
      label: Datasets & benchmarks
      description: Papers introducing datasets, benchmarks or evaluation protocols for depth or mapping.
    - id: survey
      label: Survey / review
      description: Survey or review articles.

relations:
  labels:
    - relation_label: uses_component
      label: Uses component
      description: Citing paper directly reuses a concrete part of the cited paper — network/encoder/backbone, module, loss, pretrained weights or code.
    - relation_label: builds_on_idea
      label: Builds on idea
      description: Citing paper adapts or extends the cited paper's core idea/method, but with its own implementation.
    - relation_label: compares_against
      label: Compares against
      description: Cited paper is used as a baseline or competitor in experiments.
    - relation_label: dataset_or_benchmark
      label: Uses dataset/benchmark
      description: Citing paper uses a dataset, split, metric or evaluation protocol introduced by the cited paper.
    - relation_label: background
      label: Background mention
      description: Cited only as related work or an example; no technical dependency.

fill_missing:
  enabled: true
  allow_pdf: true
  allow_llm: true
  fields: [abstract, year, venue, authors]

update:
  overlap_days: 3
  track_citations_of_core: true
  core_min_relevance: 0.9
  default_since_days: 30

export:
  inbox_days: 14
  canvas_categories: []
