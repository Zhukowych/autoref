[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoref"
version = "0.1.0"
description = "Literature-review CLI: harvest papers, categorize with LLMs, label citation relations, export to Obsidian"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "feedparser>=6",
  "pypdf>=4",
  "openai>=1.30",
  "anthropic>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
autoref = "autoref.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoref = ["prompts/*.txt", "templates/*.yaml", "obsidian/plugin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
